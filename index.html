<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internship board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2F2EE;
    --white: #FFFFFF;
    --ink: #241F20;
    --maroon: #7A232F;
    --maroon-dark: #58151F;
    --maroon-wash: #FAF3F3;
    --rule: #DCDCD5;
    --slate: #5C5854;
    --muted: #8C8880;
    --gold: #F1DFAF;
    --stub-w: 112px;
    --spine: 24px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    border-top: 4px solid var(--maroon);
    background: var(--paper);
    color: var(--ink);
    font-family: "Archivo", system-ui, sans-serif;
    font-variation-settings: "wdth" 100;
    font-size: 1rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--maroon); text-underline-offset: 2px; }
  :focus-visible { outline: 2px solid var(--maroon); outline-offset: 3px; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 24px; }

  /* Top bar */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px 0; border-bottom: 1px solid var(--rule);
  }
  .brand {
    font-family: "Newsreader", Georgia, serif;
    font-weight: 600; font-size: 1.1rem; letter-spacing: -0.01em;
  }
  .btn {
    display: inline-block; font: inherit; font-weight: 600; text-decoration: none;
    background: var(--maroon); color: var(--white); border: 0; border-radius: 2px;
    padding: 11px 18px; cursor: pointer; white-space: nowrap;
    transition: background-color .15s ease;
  }
  .btn:hover { background: var(--maroon-dark); }
  .btn-quiet { background: transparent; color: var(--maroon); box-shadow: inset 0 0 0 1.5px var(--maroon); }
  .btn-quiet:hover { background: var(--maroon-wash); }

  /* Hero: the live count is the headline */
  .hero { padding: 52px 0 40px; }
  .hero h1 {
    margin: 0;
    font-family: "Newsreader", Georgia, serif;
    font-weight: 600;
    font-size: clamp(2.2rem, 6vw, 3.7rem);
    line-height: 1.05;
    letter-spacing: -0.018em;
    max-width: 18ch;
    text-wrap: balance;
  }
  .hero .soon {
    display: inline-block;
    margin-top: 18px;
    font-size: clamp(1rem, 2.2vw, 1.2rem);
    font-weight: 500;
    color: var(--slate);
  }
  .mark {
    background: var(--gold);
    color: var(--ink);
    padding: 0.06em 0.24em;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }

  /* Controls */
  .controls {
    display: grid; gap: 12px;
    grid-template-columns: 2fr repeat(3, 1fr);
    padding-bottom: 26px;
  }
  .controls label { display: block; font-size: 0.8rem; color: var(--slate); margin-bottom: 5px; }
  .controls input, .controls select {
    width: 100%; font: inherit; color: var(--ink); background: var(--white);
    border: 1px solid var(--rule); border-radius: 2px; padding: 10px 11px;
  }
  .controls input:focus, .controls select:focus {
    border-color: var(--maroon); outline: none; box-shadow: 0 0 0 3px rgba(122, 35, 47, .14);
  }

  .tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--rule); }
  .tab {
    font: inherit; font-weight: 600; background: none; border: 0; cursor: pointer;
    color: var(--muted); padding: 10px 0; margin-bottom: -1px; border-bottom: 2px solid transparent;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--maroon); }
  .tab .n { font-weight: 400; color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }

  /* Listing rows: deadline spine + body */
  .list { list-style: none; margin: 0; padding: 0; }
  .row {
    display: grid; grid-template-columns: var(--stub-w) 1fr;
    padding: 28px 0; border-bottom: 1px solid var(--rule);
  }
  .stub {
    text-align: right; padding-right: var(--spine); line-height: 1;
    font-variation-settings: "wdth" 100;
  }
  .stub .mo { display: block; font-size: 0.82rem; font-weight: 600; color: var(--maroon); }
  .stub .day {
    display: block; font-size: 3.3rem; font-weight: 800; line-height: 0.9;
    letter-spacing: -0.01em; margin: 6px 0 9px;
    font-variation-settings: "wdth" 70;
    font-variant-numeric: tabular-nums;
  }
  .stub .left { display: inline-block; font-size: 0.82rem; font-weight: 600; color: var(--slate); line-height: 1.35; }
  .stub .rolling {
    display: block; margin-top: 8px;
    font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 600;
    font-size: 1.6rem; line-height: 1; color: var(--maroon);
  }
  .row.is-past .stub .mo { color: var(--muted); }
  .row.is-past .stub .day, .row.is-past .stub .rolling { color: var(--muted); }
  .row.is-past .body h2 { color: var(--slate); }

  .body { padding-left: var(--spine); border-left: 1px solid var(--rule); }
  .body h2 {
    margin: 0; font-family: "Newsreader", Georgia, serif;
    font-size: 1.42rem; line-height: 1.22; font-weight: 600; letter-spacing: -0.008em;
  }
  .org { margin: 4px 0 12px; color: var(--slate); font-size: 0.95rem; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 8px; margin: 0 0 14px; padding: 0; list-style: none; }
  .facts li {
    font-size: 0.82rem; color: var(--slate); background: var(--white);
    border: 1px solid var(--rule); border-radius: 2px; padding: 3px 9px;
  }
  .facts li.paid { border-color: var(--maroon); background: var(--maroon-wash); color: var(--maroon-dark); }
  .actions { display: flex; align-items: center; gap: 8px 18px; flex-wrap: wrap; margin-top: 16px; }
  .posted { font-size: 0.85rem; color: var(--muted); }

  details { width: 100%; }
  summary {
    cursor: pointer; font-weight: 600; font-size: 0.92rem; color: var(--maroon);
    width: max-content; list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "+"; display: inline-block; width: 1em; font-weight: 700; }
  details[open] summary::before { content: "\2013"; }
  .detail-body { margin-top: 14px; padding: 18px 20px; background: var(--white); border-left: 2px solid var(--maroon); }
  details[open] .detail-body { animation: reveal .18s ease-out; }
  @keyframes reveal { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .desc { white-space: pre-line; margin: 0 0 16px; max-width: 66ch; line-height: 1.6; }
  .meta { display: grid; grid-template-columns: max-content 1fr; gap: 6px 20px; margin: 0; font-size: 0.92rem; }
  .meta dt { color: var(--muted); }
  .meta dd { margin: 0; }

  .empty { padding: 56px 0; }
  .empty p { margin: 0 0 18px; font-family: "Newsreader", Georgia, serif; font-size: 1.35rem; line-height: 1.35; max-width: 34ch; }

  footer { padding: 52px 0 72px; color: var(--muted); font-size: 0.88rem; }
  footer .signup {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 14px 24px; padding: 24px 0; margin-bottom: 22px;
    border-top: 2px solid var(--maroon); color: var(--ink);
  }
  footer .signup p { margin: 0; font-family: "Newsreader", Georgia, serif; font-size: 1.2rem; }

  @media (max-width: 680px) {
    :root { --stub-w: 74px; --spine: 16px; }
    .wrap { padding: 0 18px; }
    .hero { padding: 36px 0 30px; }
    .controls { grid-template-columns: 1fr 1fr; }
    .controls .search, .controls .major { grid-column: 1 / -1; }
    .stub .day { font-size: 2.4rem; }
    .stub .rolling { font-size: 1.15rem; }
    .body h2 { font-size: 1.25rem; }
    .topbar .btn { padding: 9px 13px; font-size: 0.9rem; }
    .meta { grid-template-columns: 1fr; gap: 2px; }
    .meta dd { margin-bottom: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    details[open] .detail-body { animation: none; }
    .btn { transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand" id="brand">Internship board</div>
      <a class="btn" id="signup-top" href="#">Get email alerts</a>
    </header>

    <section class="hero" aria-live="polite">
      <h1 id="headline">Loading internships</h1>
      <div><span class="soon" id="soon"></span></div>
    </section>

    <section class="controls" aria-label="Filter internships">
      <div class="search">
        <label for="q">Search</label>
        <input id="q" type="search" placeholder="Title, company, or keyword" autocomplete="off">
      </div>
      <div class="major">
        <label for="f-major">Major</label>
        <select id="f-major"><option value="">All majors</option></select>
      </div>
      <div>
        <label for="f-pay">Pay</label>
        <select id="f-pay">
          <option value="">Paid or unpaid</option>
          <option value="Paid">Paid only</option>
          <option value="Unpaid">Unpaid</option>
          <option value="Stipend or course credit">Stipend or credit</option>
        </select>
      </div>
      <div>
        <label for="f-mode">Work setting</label>
        <select id="f-mode">
          <option value="">Any setting</option>
          <option>On-site</option>
          <option>Hybrid</option>
          <option>Remote</option>
        </select>
      </div>
    </section>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-open" aria-selected="true" aria-controls="results">Open<span class="n" id="n-open"></span></button>
      <button class="tab" role="tab" id="tab-past" aria-selected="false" aria-controls="results">Past<span class="n" id="n-past"></span></button>
    </div>

    <main id="results" role="tabpanel"></main>

    <footer>
      <div class="signup">
        <p>Get an email when new internships are posted.</p>
        <a class="btn btn-quiet" id="signup-bottom" href="#">Get email alerts</a>
      </div>
      <div id="updated"></div>
    </footer>
  </div>

<script>
/* ============ Settings: edit these ============ */
const COLLEGE_NAME = "University of Montana";
const SIGNUP_FORM_URL = "https://YOUR-N8N-DOMAIN/form/internship-alerts";
const CLOSING_SOON_DAYS = 7;
/* ============================================== */

const $ = (id) => document.getElementById(id);
const state = { all: [], tab: location.hash === "#past" ? "past" : "open" };
const DAY = 86400000;

$("brand").textContent = COLLEGE_NAME + " internship board";
document.title = COLLEGE_NAME + " internship board";
$("signup-top").href = SIGNUP_FORM_URL;
$("signup-bottom").href = SIGNUP_FORM_URL;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function safeUrl(u) {
  try { const url = new URL(u); return /^https?:$/.test(url.protocol) ? url.href : ""; } catch { return ""; }
}
function linkEmails(escaped) {
  return escaped.replace(/[\w.+-]+@[\w-]+\.[\w.-]+/g, (m) => `<a href="mailto:${m}">${m}</a>`);
}
// "2026-09-30" -> local-midnight Date (new Date("2026-09-30") would be UTC and shift a day)
function parseDay(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || "");
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function today() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function fmt(d, opts) { return d.toLocaleDateString(undefined, opts); }

function enrich(item) {
  const deadline = parseDay(item.deadline);
  const daysLeft = deadline ? Math.round((deadline - today()) / DAY) : null;
  const isPast = item.status === "closed" || (daysLeft !== null && daysLeft < 0);
  const postedAt = item.posted_at ? new Date(item.posted_at) : null;
  return { ...item, _deadline: deadline, _daysLeft: daysLeft, _past: isPast, _postedAt: postedAt,
    _search: [item.title, item.company, item.location, item.description, (item.majors || []).join(" ")].join(" ").toLowerCase() };
}

function matchesFilters(it) {
  const q = $("q").value.trim().toLowerCase();
  const major = $("f-major").value;
  const pay = $("f-pay").value;
  const mode = $("f-mode").value;
  if (q && !q.split(/\s+/).every((w) => it._search.includes(w))) return false;
  if (major) {
    const m = it.majors || [];
    if (m.length && !m.includes(major) && !m.includes("Any major")) return false;
  }
  if (pay && it.paid !== pay) return false;
  if (mode && it.work_mode !== mode) return false;
  return true;
}

function stubHtml(it) {
  if (!it._deadline) {
    return `<div class="stub" aria-label="Rolling deadline"><span class="mo">Deadline</span><span class="rolling">Rolling</span></div>`;
  }
  const d = it._deadline, n = it._daysLeft;
  let left;
  if (it._past) left = "Closed";
  else if (n === 0) left = `<span class="mark">Due today</span>`;
  else if (n <= CLOSING_SOON_DAYS) left = `<span class="mark">${n} day${n === 1 ? "" : "s"} left</span>`;
  else left = `${n} days left`;
  const label = `Deadline ${fmt(d, { month: "long", day: "numeric", year: "numeric" })}`;
  return `<div class="stub" aria-label="${esc(label)}">
      <span class="mo">${esc(fmt(d, { month: "short" }))}</span>
      <span class="day">${d.getDate()}</span>
      <span class="left">${left}</span>
    </div>`;
}

function postedText(it) {
  if (!it._postedAt || isNaN(it._postedAt)) return "";
  const days = Math.floor((today() - new Date(it._postedAt.getFullYear(), it._postedAt.getMonth(), it._postedAt.getDate())) / DAY);
  if (days <= 0) return "Posted today";
  if (days === 1) return "Posted yesterday";
  if (days < 14) return `Posted ${days} days ago`;
  return `Posted ${fmt(it._postedAt, { month: "short", day: "numeric" })}`;
}

function rowHtml(it) {
  const facts = [];
  if (it.paid) facts.push(`<li class="${it.paid === "Paid" ? "paid" : ""}">${esc(it.paid)}${it.pay ? ", " + esc(it.pay) : ""}</li>`);
  if (it.work_mode) facts.push(`<li>${esc(it.work_mode)}</li>`);
  if (it.majors && it.majors.length) facts.push(`<li>${esc(it.majors.join(", "))}</li>`);

  const meta = [];
  const start = parseDay(it.start_date);
  if (start) meta.push(["Starts", fmt(start, { month: "long", day: "numeric", year: "numeric" })]);
  if (it._deadline) meta.push(["Apply by", fmt(it._deadline, { weekday: "short", month: "long", day: "numeric" })]);
  if (it.years && it.years.length) meta.push(["Open to", it.years.join(", ")]);
  if (it.contact) meta.push(["Questions", it.contact, true]);
  if (it.posted_by) meta.push(["Shared by", it.posted_by]);

  const url = safeUrl(it.apply_link);
  const apply = url
    ? `<a class="btn ${it._past ? "btn-quiet" : ""}" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${it._past ? "View posting" : "Apply"}</a>`
    : "";

  return `<li class="row ${it._past ? "is-past" : ""}">
    ${stubHtml(it)}
    <div class="body">
      <h2>${esc(it.title)}</h2>
      <p class="org">${esc(it.company)}${it.location ? ", " + esc(it.location) : ""}</p>
      ${facts.length ? `<ul class="facts">${facts.join("")}</ul>` : ""}
      <details>
        <summary>Details</summary>
        <div class="detail-body">
          ${it.description ? `<p class="desc">${esc(it.description)}</p>` : ""}
          ${meta.length ? `<dl class="meta">${meta.map(([k, v, links]) => `<dt>${esc(k)}</dt><dd>${links ? linkEmails(esc(v)) : esc(v)}</dd>`).join("")}</dl>` : ""}
        </div>
      </details>
      <div class="actions">
        ${apply}
        ${postedText(it) ? `<span class="posted">${esc(postedText(it))}</span>` : ""}
      </div>
    </div>
  </li>`;
}

function render() {
  const open = state.all.filter((i) => !i._past);
  const past = state.all.filter((i) => i._past);

  // Hero counts always reflect everything open, not the filters
  const soon = open.filter((i) => i._daysLeft !== null && i._daysLeft <= CLOSING_SOON_DAYS).length;
  $("headline").textContent = open.length === 0 ? "No internships are open right now." : open.length === 1 ? "1 internship is open." : `${open.length} internships are open.`;
  $("soon").innerHTML = soon
    ? `<span class="mark">${soon} close${soon === 1 ? "s" : ""} in the next ${CLOSING_SOON_DAYS} days.</span>`
    : open.length ? "None close in the next week." : "";

  const openShown = open.filter(matchesFilters)
    .sort((a, b) => (a._deadline ? a._deadline : Infinity) - (b._deadline ? b._deadline : Infinity));
  const pastShown = past.filter(matchesFilters)
    .sort((a, b) => (b._deadline || b._postedAt || 0) - (a._deadline || a._postedAt || 0));

  $("n-open").textContent = openShown.length;
  $("n-past").textContent = pastShown.length;
  $("tab-open").setAttribute("aria-selected", state.tab === "open");
  $("tab-past").setAttribute("aria-selected", state.tab === "past");

  const shown = state.tab === "open" ? openShown : pastShown;
  const filtered = $("q").value || $("f-major").value || $("f-pay").value || $("f-mode").value;

  if (!shown.length) {
    const msg = filtered
      ? `No ${state.tab} internships match these filters.`
      : state.tab === "open"
        ? "Sign up for alerts to hear when the next one is posted."
        : "Internships show up here after their deadline passes.";
    $("results").innerHTML = `<div class="empty"><p>${msg}</p>${filtered
      ? `<button class="btn btn-quiet" id="clear">Clear filters</button>`
      : state.tab === "open" ? `<a class="btn" href="${esc(SIGNUP_FORM_URL)}">Get email alerts</a>` : ""}</div>`;
    const c = $("clear");
    if (c) c.onclick = () => { $("q").value = ""; ["f-major", "f-pay", "f-mode"].forEach((id) => ($(id).value = "")); render(); };
    return;
  }
  $("results").innerHTML = `<ul class="list">${shown.map(rowHtml).join("")}</ul>`;
}

function setTab(tab) {
  state.tab = tab;
  history.replaceState(null, "", tab === "past" ? "#past" : location.pathname + location.search);
  render();
}

async function load() {
  try {
    // Cache-buster so new postings show up as soon as GitHub Pages serves the new file
    const res = await fetch(`internships.json?v=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    state.all = (data.internships || []).map(enrich);

    const majors = [...new Set(state.all.flatMap((i) => i.majors || []))].filter((m) => m !== "Any major").sort();
    $("f-major").insertAdjacentHTML("beforeend", majors.map((m) => `<option>${esc(m)}</option>`).join(""));

    if (data.updated_at) {
      $("updated").textContent = `List updated ${fmt(new Date(data.updated_at), { month: "long", day: "numeric", hour: "numeric", minute: "2-digit" })}`;
    }
    render();
  } catch (err) {
    $("headline").textContent = "The internship list didn't load.";
    $("soon").textContent = "";
    $("results").innerHTML = `<div class="empty"><p>Refresh the page to try again. If this keeps happening, internships.json is missing from the site.</p></div>`;
  }
}

$("q").addEventListener("input", render);
["f-major", "f-pay", "f-mode"].forEach((id) => $(id).addEventListener("change", render));
$("tab-open").onclick = () => setTab("open");
$("tab-past").onclick = () => setTab("past");
load();
</script>
</body>
</html>
